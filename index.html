<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>futari · 둘만의 작은 집</title>
  <meta name="futari-build" content="2026-10-14.4" />
  <meta name="theme-color" content="#ff5d8f" />
  <meta name="description" content="선택과 반응으로 둘만의 집과 추억을 쌓아요." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="futari" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

  <!-- React (로컬) — Babel 불필요: 순수 JS로 작성 -->
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>

  <!-- Supabase (공유 DB) -->
  <script src="vendor/supabase.js"></script>
  <script src="config.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: linear-gradient(160deg, #fff1f5 0%, #ffe8ef 40%, #fde7f3 100%);
      color: #3a2b33;
      min-height: 100vh;
    }
    #root { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
    .app { padding: 16px 16px 92px; }
    .card { background: rgba(255,255,255,0.85); border: 1px solid rgba(255,180,205,0.5); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(255,150,185,0.12); }
    .title-xl { font-size: 22px; font-weight: 800; margin: 0; }
    .title-lg { font-size: 18px; font-weight: 700; margin: 0 0 10px; }
    .muted { color: #a07f8e; font-size: 13px; }
    .center { text-align: center; }
    .btn { border: none; cursor: pointer; border-radius: 12px; padding: 11px 14px; font-size: 15px; font-weight: 600; background: #ff5d8f; color: #fff; }
    .btn:active { transform: scale(0.97); }
    .btn.ghost { background: #ffe1ea; color: #d83c6b; }
    .btn.gray { background: #efe7eb; color: #6b5560; }
    .btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
    .btn.block { width: 100%; }
    input, textarea, select { width: 100%; border: 1px solid #f3c6d6; border-radius: 11px; padding: 10px 12px; font-size: 15px; background: #fff; color: #3a2b33; outline: none; font-family: inherit; }
    input:focus, textarea:focus, select:focus { border-color: #ff8fb3; }
    label { font-size: 13px; font-weight: 600; color: #8a6b78; display: block; margin: 10px 0 5px; }
    textarea { resize: vertical; min-height: 60px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .hero { text-align: center; padding: 22px 16px 18px; background: linear-gradient(135deg, #ff7aa2, #ff5d8f); color: #fff; border-radius: 0 0 26px 26px; margin: -16px -16px 16px; box-shadow: 0 8px 22px rgba(255,93,143,0.3); }
    .hero .names { font-size: 20px; font-weight: 800; }
    .hero .dday { font-size: 40px; font-weight: 900; letter-spacing: -1px; margin: 6px 0 2px; }
    .hero .sub { font-size: 13px; opacity: .92; }
    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: flex; background: rgba(255,255,255,0.96); border-top: 1px solid #ffd6e3; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 1000; }
    .tab { flex: 1; border: none; background: none; cursor: pointer; padding: 6px 2px; font-size: 10px; color: #b78a9a; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .tab .ico { font-size: 20px; }
    .tab.active { color: #ff3d7f; }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill.pink { background: #ffe1ea; color: #d83c6b; }
    .pill.gray { background: #eee; color: #888; }
    .item { background: #fff; border: 1px solid #ffe0ea; border-radius: 14px; padding: 12px; margin-bottom: 10px; }
    .item .when { font-size: 12px; color: #c08; font-weight: 700; }
    .item .t { font-size: 15px; font-weight: 700; margin: 3px 0; }
    .item .m { font-size: 13px; color: #6b5560; white-space: pre-wrap; }
    .thumb { width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
    .empty { text-align: center; color: #c3a3b0; padding: 24px 10px; font-size: 14px; }
    .timeline-line { position: relative; padding-left: 20px; }
    .timeline-line::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: linear-gradient(#ff9fbd, #ffd0de); }
    .dot { position: absolute; left: 0; width: 14px; height: 14px; border-radius: 50%; background: #ff5d8f; border: 3px solid #fff; box-shadow: 0 0 0 1px #ffb3cb; }
    .seg { display: flex; gap: 6px; background: #ffe1ea; padding: 4px; border-radius: 12px; margin-bottom: 12px; }
    .seg button { flex: 1; border: none; background: none; padding: 8px; border-radius: 9px; font-weight: 700; font-size: 13px; color: #c17; cursor: pointer; }
    .seg button.on { background: #fff; color: #ff3d7f; }
    .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .badge { text-align: center; font-size: 11px; }
    .badge .b-ico { font-size: 26px; filter: grayscale(1); opacity: .3; }
    .badge.got .b-ico { filter: none; opacity: 1; }
    .bar { height: 10px; background: #ffe1ea; border-radius: 999px; overflow: hidden; }
    .bar > div { height: 100%; background: linear-gradient(90deg,#ff8fb3,#ff3d7f); border-radius: 999px; }
    .mood-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .mood { font-size: 26px; background: #fff; border: 1px solid #ffe0ea; border-radius: 12px; padding: 8px 0; cursor: pointer; }
    .mood.on { background: #ffe1ea; border-color: #ff8fb3; }
    .q-card { background: linear-gradient(135deg,#ffd3e2,#ffc0d6); border-radius: 18px; padding: 22px 18px; text-align: center; font-size: 17px; font-weight: 700; color: #a6265a; min-height: 90px; display: flex; align-items: center; justify-content: center; }
    .link { color: #d83c6b; text-decoration: underline; cursor: pointer; font-size: 13px; }
    .modal-bg { position: fixed; inset: 0; background: rgba(60,30,45,.45); z-index: 2000; display: flex; align-items: flex-end; justify-content: center; }
    .modal-box { background: #fff; width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 18px; max-height: 85vh; overflow-y: auto; }
    .photo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
    .photo-grid:empty { display: none; }
    .photo-button { border: 0; padding: 0; background: #ffe1ea; border-radius: 12px; overflow: hidden; cursor: pointer; }
    .photo-button img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
    .viewer-image { width: 100%; max-height: 60vh; object-fit: contain; display: block; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 16px 0; }
    .calendar-day { min-height: 44px; border: 1px solid transparent; border-radius: 10px; background: #fff; color: #3a2b33; cursor: pointer; font: inherit; }
    .calendar-day.today { border-color: #ff8fb3; }
    .calendar-day.selected { background: #ff5d8f; color: white; }
    .event-dot { display: block; height: 10px; font-size: 8px; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #b12c62; outline-offset: 2px; }
    .row > * { min-width: 0; }
    .game-score { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; padding: 12px 14px; margin: 14px 0; background: #fff; border: 1px solid #f3c6d6; border-radius: 14px; font-size: 13px; }
    .game-score strong { color: #ad2656; overflow-wrap: anywhere; }
    .game-table { background: linear-gradient(145deg, #fffaf3, #fff0f4); }
    .game-status { text-align: center; font-size: 21px; font-weight: 800; padding: 8px; overflow-wrap: anywhere; }
    .player-legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 8px 0 16px; }
    .player-tag { padding: 7px 12px; border-radius: 999px; font-size: 13px; border: 2px solid transparent; overflow-wrap: anywhere; }
    .player-0 { color: #a72852; background: #ffdae5; }
    .player-1 { color: #205770; background: #d6edf7; }
    .player-tag.current { border-color: currentColor; font-weight: 800; }
    .bounce-scores { display:flex; gap:10px; margin:16px 0; }
    .bounce-scores > div { flex:1; text-align:center; }
    .bounce-scores small { display:block; margin-top:6px; font-weight:400; }
    .bounce-challenge { display:flex; gap:16px; align-items:center; background:#fffaf0; border:1px solid #ead5bd; border-radius:18px; padding:12px; }
    .bounce-challenge p { margin-bottom:0; }
    .pattern-preview { width:90px; height:90px; flex:none; background:#f0e1ce; border-radius:12px; }
    .bounce-table { display:block; width:100%; height:auto; background:#fff3e1; border-radius:24px; touch-action:none; user-select:none; cursor:grab; }
    .bounce-table:active { cursor:grabbing; }
    .bounce-table:focus-visible { outline:3px solid #b12c62; outline-offset:3px; }
    .bounce-feedback { background:#fff; border-radius:12px; padding:12px; font-size:14px; line-height:1.6; min-height:64px; }
    .shared-status { padding:14px; border-radius:12px; background:#fff3df; font-weight:700; }
    .omok-scroll { overflow-x:auto; padding:3px; }
    .omok-board { display:grid; grid-template-columns:repeat(15,minmax(0,1fr)); min-width:360px; padding:10px; border:6px solid #9b7350; border-radius:12px; background:#e5bb82; }
    .omok-cell { position:relative; padding:0; border:0; background:linear-gradient(transparent calc(50% - .5px),#a17d51 calc(50% - .5px),#a17d51 calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(90deg,transparent calc(50% - .5px),#a17d51 calc(50% - .5px),#a17d51 calc(50% + .5px),transparent calc(50% + .5px)); aspect-ratio:1; cursor:pointer; color:#a6265a; }
    .omok-cell:disabled { opacity:1; }
    .omok-cell .stone { display:block; position:absolute; inset:9%; border-radius:50%; }
    .stone-me .stone { background:radial-gradient(circle at 35% 30%,#666,#161616 65%); box-shadow:1px 2px 2px #68452566; }
    .stone-you .stone { background:radial-gradient(circle at 35% 30%,#fff,#ddd 80%); box-shadow:1px 2px 2px #68452566; }
    .omok-cell.last .stone:after { content:''; position:absolute; top:40%; left:40%; width:20%; height:20%; border-radius:50%; background:#e87575; }
    .omok-cell.win .stone { outline:3px solid #e2527a; }
    .omok-cell.candidate { outline:2px solid #d83c6b; z-index:1; }
    .code-hand { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
    .code-tile { width:48px; min-height:72px; border:2px solid #dbbda5; border-radius:10px; font:inherit; cursor:pointer; }
    .code-tile span { display:block; font-size:24px; font-weight:800; }
    .code-tile small { display:block; font-size:9px; margin-top:6px; }
    .code-tile.black { background:#352d2b; color:#fff; }
    .code-tile.white { background:#fff; color:#352d2b; }
    .code-tile:disabled { opacity:1; }
    .code-tile.revealed { border-style:dashed; }
    .code-tile.selected { outline:3px solid #ff5d8f; outline-offset:2px; }
    .code-numbers { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .code-drawn { padding:12px; background:#fff; border-radius:12px; }
    .turn-dot { margin-left:4px; color:#cc375e; font-size:9px; }
    .board-selector button { padding:10px 3px; font-size:12px; }
    .reset-request { margin-top:12px; }
    details summary { cursor:pointer; font-weight:600; }
    details li { font-size:13px; line-height:1.7; }
    .app-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; font-size:12px; color:#8a6b78; }
    .home-heading { margin-bottom:18px; }
    .eyebrow { font-size:10px; letter-spacing:2px; color:#947667; }
    .house { height:240px; position:relative; overflow:hidden; border:8px solid #ead5bd; border-radius:90px 90px 20px 20px; background:linear-gradient(#fff6df 72%,#e4c3a5 72%); box-shadow:0 12px 30px #b8835520; }
    .house-window { position:absolute; top:24px; left:28px; padding:12px 22px; background:#dceded; border:6px solid white; border-radius:12px; font-size:28px; }
    .house-shelf { position:absolute; right:22px; top:68px; border-bottom:6px solid #bb916e; font-size:25px; }
    .house-sofa { position:absolute; bottom:28px; left:50%; transform:translateX(-50%); font-size:92px; }
    .house-people { position:absolute; bottom:72px; left:50%; transform:translateX(-50%); display:flex; gap:16px; font-size:36px; }
    .house-rug { position:absolute; bottom:7px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:12px; background:#fff0d6; padding:5px 20px; border-radius:50%; }
    .house-cat { position:absolute; bottom:25px; right:16px; font-size:30px; }
    .growth-strip { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding:18px 4px 24px; font-size:13px; }
    .growth-strip progress { width:100%; height:9px; accent-color:#c77960; }
    .growth-strip small { color:#987e70; }
    .partner-status { background:#fff7ee; padding:12px; border-radius:12px; margin:12px 0; font-size:13px; }
    .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .choice { padding:20px 8px; border:2px solid #f1e2d4; border-radius:16px; background:#fffaf3; color:#654c40; font:inherit; cursor:pointer; min-height:70px; }
    .choice.selected { background:#ffe1ea; border-color:#ff8fb3; }
    .result { background:#fff7ee; padding:14px; border-radius:12px; line-height:1.8; font-size:14px; }
    .tab { min-height:48px; font-size:12px; }
    input,textarea,select { font-size:16px; }
    [hidden] { display: none !important; }
    .install-banner { max-width:480px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; color:#6b5560; font-size:13px; }
  </style>
</head>
<body>
  <aside id="pwa-install" class="install-banner" hidden aria-label="앱 설치">
    <span id="pwa-install-message">우리 집을 홈 화면에서 바로 열어요</span>
    <button id="pwa-install-button" class="btn sm" type="button">앱 설치</button>
  </aside>
  <aside id="pwa-update" class="install-banner" hidden aria-label="앱 업데이트">
    <span id="pwa-update-message" role="status">새 버전이 준비됐어요</span>
    <button id="pwa-update-button" class="btn sm" type="button">업데이트</button>
  </aside>
  <div id="root"></div>
  <script src="games.js"></script>
  <script src="home.js"></script>
  <script src="board-games.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
