<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>futari · 읽기 전용 데이터 구조</title><style>

</style></head><body><main><h1>남아 있는 약속부터 지켜요</h1><p class="notice">데이터를 서버에 보내거나 덮어쓰지 않는 읽기 전용 화면입니다. 앱을 쓰던 아이폰과 같은 접속 방식에서 열어주세요. Safari와 홈 화면 앱의 저장 공간은 다를 수 있습니다.</p><button id="export-rescue" type="button">기기 원본 백업 내려받기</button><p id="rescue-status" role="status"></p><div id="rescue-list"></div><p>백업 파일에는 두 사람의 개인 기록이 들어 있습니다. 공개 게시판에 올리지 말고 안전하게 보관해주세요. 복원은 원본과 현재 서버 데이터를 비교한 뒤 진행해야 합니다.</p></main><script src="preservation.js"></script><script src="rescue.js"></script></body></html>
