<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>futari · 최신 화면 다시 받기</title>
  <style>
    * {box-sizing:border-box} body {margin:0;padding:28px 20px;background:#fff1f5;color:#3a2b33;font-family:system-ui,sans-serif;line-height:1.7}
    main {max-width:440px;margin:30px auto;background:#fff;border-radius:22px;padding:24px}
    h1 {font-size:23px;line-height:1.4} p {font-size:14px} button,a {font:inherit}
    button {width:100%;padding:14px;background:#ff5d8f;color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:700}
    button:disabled {opacity:.5} a {color:#b12c62} #status {min-height:48px} small {color:#8a6b78}
  </style>
</head>
<body>
  <main>
    <h1>우리 집 화면을 새로 받아요</h1>
    <p>예전 게임이나 화면이 계속 보일 때 사용하세요. 다른 futari 앱 창과 탭을 닫고 이 페이지에서 진행해주세요.</p>
    <p>방 코드·사용자 선택·추억·보드게임 기록은 유지합니다. 바운스오프의 현재 경기는 앱을 다시 열면 초기화됩니다.</p>
    <button id="recover" type="button">최신 화면 다시 받기</button>
    <p id="status" role="status" aria-live="polite">인터넷 연결이 필요해요.</p>
    <a id="open-app" href="./" hidden>futari 다시 열기 →</a>
    <p><small>브라우저의 사이트 데이터 전체 삭제는 필요하지 않아요.</small></p>
  </main>
  <script src="./recovery.js"></script>
</body>
</html>
